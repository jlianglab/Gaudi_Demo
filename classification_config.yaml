ChestXray14: 
  data_dir:  <PATH_TO_DATASET>
  train_list: /workspace/Ark_Plus/dataset/ChestXray14/Xray14_train_official.txt
  val_list: /workspace/Ark_Plus/dataset/ChestXray14/Xray14_val_official.txt
  test_list:  /workspace/Ark_Plus/dataset/ChestXray14/Xray14_test_official.txt
  diseases: ['Atelectasis', 'Cardiomegaly', 'Effusion', 'Infiltration', 'Mass', 'Nodule', 'Pneumonia', 'Pneumothorax', 'Consolidation', 'Edema', 'Emphysema', 'Fibrosis', 'Pleural_Thickening', 'Hernia']
  task_type: multi-label classification

VinDrCXR: 
  data_dir: <PATH_TO_DATASET>
  train_list: /workspace/Ark_Plus/dataset/VinDrCXR/VinDrCXR_train_pe_global_one.txt
  val_list: /workspace/Ark_Plus/dataset/VinDrCXR/VinDrCXR_test_pe_global_one.txt
  test_list: /workspace/Ark_Plus/dataset/VinDrCXR/VinDrCXR_test_pe_global_one.txt
  diseases: ['PE', 'Lung tumor', 'Pneumonia', 'Tuberculosis', 'Other diseases', 'No finding']
  task_type: multi-label classification

CheXpert: 
  data_dir: <PATH_TO_DATASET>/
  train_list: ../dataset/CheXpert/CheXpert_train_official.csv
  val_list: ../dataset/CheXpert/CheXpert_valid_official.csv
  test_list: ../dataset/CheXpert/CheXpert_test_official.csv
  diseases: ['No Finding', 'Enlarged Cardiomediastinum', 'Cardiomegaly', 'Lung Opacity', 'Lung Lesion', 'Edema', 'Consolidation', 'Pneumonia', 'Atelectasis', 'Pneumothorax', 'Pleural Effusion', 'Pleural Other', 'Fracture', 'Support Devices']
  test_diseases_name: ['Atelectasis', 'Cardiomegaly', 'Consolidation', 'Edema', 'Pleural Effusion']
  task_type: multi-label classification

RSNAPneumonia: 
  data_dir: <PATH_TO_DATASET>/rsna-pneumonia-detection-challenge/stage_2_train_images_png/
  train_list: ../dataset/RSNA/RSNAPneumonia_train.txt
  val_list: ../dataset/RSNA/RSNAPneumonia_val.txt
  test_list: ../dataset/RSNA/RSNAPneumonia_test.txt
  diseases: ['Normal', 'No Lung Opacity/Not Normal', 'Lung Opacity']
  task_type: multi-class classification

MIMIC: 
  data_dir: <PATH_TO_DATASET>/MIMIC_jpeg/physionet.org/files/mimic-cxr-jpg/2.0.0/
  train_list: ../dataset/MIMIC/mimic-cxr-2.0.0-train.csv
  val_list: ../dataset/MIMIC/mimic-cxr-2.0.0-validate.csv
  test_list: ../dataset/MIMIC/mimic-cxr-2.0.0-test.csv
  diseases: ['Atelectasis', 'Cardiomegaly', 'Consolidation', 'Edema', 'Enlarged Cardiomediastinum', 'Fracture', 'Lung Lesion', 'Lung Opacity', 'No Finding', 'Pleural Effusion', 'Pleural Other', 'Pneumonia', 'Pneumothorax', 'Support Devices']
  test_diseases_name: ['Atelectasis', 'Cardiomegaly', 'Consolidation', 'Edema', 'Enlarged Cardiomediastinum', 'Fracture', 'Lung Lesion', 'Lung Opacity', 'No Finding', 'Pleural Effusion', 'Pleural Other', 'Pneumonia', 'Pneumothorax', 'Support Devices']
  task_type: multi-label classification

COVIDx:
  data_dir: <PATH_TO_DATASET>/covidx-cxr3/
  train_list: ../dataset/covidx3/train_COVIDx9A_clean.txt
  val_list: ../dataset/covidx3/test_COVIDx9A.txt
  test_list: ../dataset/covidx3/test_COVIDx9A.txt
  diseases: ['normal', 'pneumonia', 'COVID-19']
  task_type: multi-class classification

medmnist:
  output_root: /path/to/medmnist/output
  data_root: /path/to/medmnist/data
